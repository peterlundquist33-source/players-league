name: Export draft board (one-off)

# Manual-only, isolated export of the complete pick-by-pick draft board to
# tools/data/<season>-draft-board.json. Does not touch the scheduled matchup
# pipeline in matchups.yml.

on:
  workflow_dispatch:
    inputs:
      season:
        description: "season year"
        default: "2026"

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Export
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
          LEAGUE_ID: ${{ secrets.LEAGUE_ID }}
        run: python3 tools/draft_board.py "${{ github.event.inputs.season || '2026' }}"

      - name: Commit & push if changed
        run: |
          if [ -n "$(git status --porcelain tools/data)" ]; then
            git config user.name  "players-league-bot"
            git config user.email "actions@users.noreply.github.com"
            git add tools/data
            git commit -m "Export draft board"
            git push
          else
            echo "no changes"
          fi
