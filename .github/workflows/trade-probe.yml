name: Trade data probe (temporary)

on:
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Probe communication/activity feed
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
          LEAGUE_ID: ${{ secrets.LEAGUE_ID }}
        run: |
          cd tools
          python3 -c "
          import urllib.request, json, urllib.error
          from lib import _get

          url = ('https://lm-api-reads.fantasy.espn.com/apis/v3/games/ffl/seasons/2026'
                 f'/segments/0/leagues/{_get(\"LEAGUE_ID\")}/communication/'
                 '?view=kona_league_communication')
          req = urllib.request.Request(url, headers={
              'Cookie': f'espn_s2={_get(\"ESPN_S2\")}; SWID={_get(\"ESPN_SWID\")}',
              'User-Agent': 'players-league/1.0',
              'Accept': 'application/json',
              'X-Fantasy-Filter': '{\"topics\":{\"filterType\":{\"value\":[\"ACTIVITY_TRANSACTIONS\"]},\"limit\":200,\"offset\":0,\"sortAsc\":false,\"sortBy\":\"date\"}}',
          })
          try:
              d = json.load(urllib.request.urlopen(req, timeout=30))
              print('top keys:', list(d.keys()))
              topics = d.get('topics', [])
              print('topics:', len(topics))
              for t in topics[:5]:
                  print(json.dumps(t, indent=1)[:1500])
                  print('---')
          except urllib.error.HTTPError as e:
              print('HTTPError', e.code, e.read()[:800])
          "
