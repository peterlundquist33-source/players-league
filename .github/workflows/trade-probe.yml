name: Trade data probe (temporary)

on:
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Probe transactions with limit/offset
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
          LEAGUE_ID: ${{ secrets.LEAGUE_ID }}
        run: |
          cd tools
          python3 -c "
          import urllib.request, json
          from lib import _get

          def fetch(params, filt=None):
              url = (f'https://lm-api-reads.fantasy.espn.com/apis/v3/games/ffl/seasons/2026'
                     f'/segments/0/leagues/{_get(\"LEAGUE_ID\")}?{params}')
              headers = {
                  'Cookie': f'espn_s2={_get(\"ESPN_S2\")}; SWID={_get(\"ESPN_SWID\")}',
                  'User-Agent': 'players-league/1.0',
                  'Accept': 'application/json',
              }
              if filt:
                  headers['X-Fantasy-Filter'] = filt
              req = urllib.request.Request(url, headers=headers)
              try:
                  return json.load(urllib.request.urlopen(req, timeout=30))
              except urllib.error.HTTPError as e:
                  print('HTTPError', e.code, e.read()[:500])
                  return {}

          import urllib.error
          d = fetch('view=mTransactions2')
          txs = d.get('transactions', [])
          print('plain call total:', len(txs))

          filt = '{\"transactions\":{\"limit\":1000,\"offset\":0,\"sortType\":{\"sortPriority\":1,\"sortAsc\":false,\"value\":\"PROCESSDATE\"}}}'
          d2 = fetch('view=mTransactions2', filt=filt)
          txs2 = d2.get('transactions', [])
          print('with X-Fantasy-Filter total:', len(txs2))
          types2 = {}
          for t in txs2:
              types2[t.get('type')] = types2.get(t.get('type'), 0) + 1
          print('by type (filtered):', types2)
          trades = [t for t in txs2 if 'TRADE' in (t.get('type') or '')]
          print('trade-ish records:', len(trades))
          for t in trades[:6]:
              print(json.dumps(t, indent=1)[:2000])
              print('===')
          "
