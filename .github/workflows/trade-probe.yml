name: Trade data probe (temporary)

on:
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Live test with the real filter shape, trades only
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
          LEAGUE_ID: ${{ secrets.LEAGUE_ID }}
        run: |
          cd tools
          python3 -c "
          import urllib.request, json, urllib.error
          from lib import _get
          filt = {
              'topics': {
                  'filterType': {'value': ['ACTIVITY_TRANSACTIONS']},
                  'limit': 200,
                  'limitPerMessageSet': {'value': 25},
                  'offset': 0,
                  'sortMessageDate': {'sortPriority': 1, 'sortAsc': False},
                  'sortFor': {'sortPriority': 2, 'sortAsc': False},
                  'filterIncludeMessageTypeIds': {'value': [244]},
              }
          }
          url = ('https://lm-api-reads.fantasy.espn.com/apis/v3/games/ffl/seasons/2026'
                 f'/segments/0/leagues/{_get(\"LEAGUE_ID\")}/communication/?view=kona_league_communication')
          req = urllib.request.Request(url, headers={
              'Cookie': f'espn_s2={_get(\"ESPN_S2\")}; SWID={_get(\"ESPN_SWID\")}',
              'User-Agent': 'players-league/1.0',
              'Accept': 'application/json',
              'x-fantasy-filter': json.dumps(filt),
          })
          try:
              d = json.load(urllib.request.urlopen(req, timeout=30))
              topics = d.get('topics', [])
              print('trade topics:', len(topics))
              for t in topics:
                  print(json.dumps(t, indent=1)[:2500])
                  print('---')
          except urllib.error.HTTPError as e:
              print('HTTPError', e.code, e.read()[:800])
          "
