name: Trade data probe (temporary)

on:
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Probe transactions
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
          LEAGUE_ID: ${{ secrets.LEAGUE_ID }}
        run: |
          cd tools
          python3 -c "
          import urllib.request, json
          from lib import _get
          url = (f'https://lm-api-reads.fantasy.espn.com/apis/v3/games/ffl/seasons/2026'
                 f'/segments/0/leagues/{_get(\"LEAGUE_ID\")}?view=mTransactions2')
          req = urllib.request.Request(url, headers={
              'Cookie': f'espn_s2={_get(\"ESPN_S2\")}; SWID={_get(\"ESPN_SWID\")}',
              'User-Agent': 'players-league/1.0',
              'Accept': 'application/json',
          })
          d = json.load(urllib.request.urlopen(req, timeout=30))
          print('top-level keys:', list(d.keys()))
          txs = d.get('transactions', [])
          print('total transactions:', len(txs))
          types = {}
          for t in txs:
              types[t.get('type')] = types.get(t.get('type'), 0) + 1
          print('by type:', types)
          by_id = {t['id']: t for t in txs if 'id' in t}
          for t in txs:
              if t.get('type') in ('TRADE_ACCEPT', 'TRADE_UPHOLD', 'TRADE_PROPOSE'):
                  rid = t.get('relatedTransactionId')
                  print('related found:', rid in by_id, '| scoringPeriod:', t.get('scoringPeriodId'))
          rooster = [t for t in txs if t.get('type') == 'ROSTER']
          print('ROSTER sample:', json.dumps(rooster[0], indent=1)[:2000] if rooster else 'none')
          print('scoringPeriod range:', sorted(set(t.get('scoringPeriodId') for t in txs)))
          "
