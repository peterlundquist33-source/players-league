name: Weekly matchups

on:
  schedule:
    # Sep–Jan only. Cron is UTC and has no timezone support, so each CT time is
    # split by month: 9-10 are CDT (UTC-5), 11-12,1 are CST (UTC-6).
    # DST ends Sun Nov 1, 2026, which is why the split lands on the month boundary.
    # Wednesday 7pm CT fires as Thursday in UTC, hence DOW 4.
    - cron: "0 0 * 9-10 4"      # Wednesdays 7pm CDT — previews
    - cron: "0 1 * 11-12,1 4"   # Wednesdays 7pm CST — previews
    - cron: "0 13 * 9-10 2"     # Tuesdays   8am CDT — recaps
    - cron: "0 14 * 11-12,1 2"  # Tuesdays   8am CST — recaps
    - cron: "0 18 * 9-12,1 1"   # Mondays    1pm CDT / 12pm CST — Monday Night Madness
  workflow_dispatch:
    inputs:
      phase:
        description: "auto | preview | recap | madness | power | rankings | facts | records | opening | podcast | odds"
        default: "auto"
      season:
        description: "season year"
        default: "2026"
      week:
        description: "week number (blank = current)"
        default: ""
      force:
        description: "rebuild even if the page exists"
        type: boolean
        default: false
      dry:
        description: "facts only, no AI copy (podcast phase)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: matchups
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Decide phase
        id: phase
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            case "${{ github.event.schedule }}" in
              "0 0 * 9-10 4"|"0 1 * 11-12,1 4")
                                 echo "phase=preview" >> "$GITHUB_OUTPUT" ;;
              "0 18 * 9-12,1 1") echo "phase=madness" >> "$GITHUB_OUTPUT" ;;
              *)                 echo "phase=recap"   >> "$GITHUB_OUTPUT" ;;
            esac
          else
            echo "phase=${{ github.event.inputs.phase || 'auto' }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
          LEAGUE_ID: ${{ secrets.LEAGUE_ID }}
        run: |
          python3 tools/main.py "${{ steps.phase.outputs.phase }}" \
            --season "${{ github.event.inputs.season || '2026' }}" \
            ${{ github.event.inputs.week && format('--week {0}', github.event.inputs.week) || '' }} \
            ${{ github.event.inputs.force == 'true' && '--force' || '' }} \
            ${{ github.event.inputs.dry == 'true' && '--dry' || '' }}

      - name: Commit & push if changed
        run: |
          PATHS="index.html matchups rankings.html draft-grades.html home.html analytics.html odds.html podcast podcast.html img/podcast tools/data js/team-facts.js js/records.js"
          if [ -n "$(git status --porcelain $PATHS)" ]; then
            git config user.name  "players-league-bot"
            git config user.email "actions@users.noreply.github.com"
            git add $PATHS
            git commit -m "${{ steps.phase.outputs.phase }} run $(date -u +%Y-%m-%d)"
            git push
          else
            echo "no changes"
          fi
