name: FantasyPros rankings cache

# Refreshes tools/data/fantasypros-cache.json on a timer so a chat session
# can answer fantasy questions from a recent snapshot without ever holding
# the FantasyPros API key itself. Season months only (Sep-Jan), hourly.

on:
  schedule:
    - cron: "0 * * 9-12,1 *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: fantasypros-cache
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh cache
        env:
          FANTASYPROS_API_KEY: ${{ secrets.FANTASYPROS_API_KEY }}
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
          LEAGUE_ID: ${{ secrets.LEAGUE_ID }}
        run: python3 tools/fp_cache.py 2026

      - name: Commit & push if changed
        run: |
          if [ -n "$(git status --porcelain tools/data/fantasypros-cache.json)" ]; then
            git config user.name  "players-league-bot"
            git config user.email "actions@users.noreply.github.com"
            git add tools/data/fantasypros-cache.json
            git commit -m "Refresh FantasyPros cache"
            git push
          else
            echo "no changes"
          fi
