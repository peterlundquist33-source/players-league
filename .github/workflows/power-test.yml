name: Power rankings test (temporary)

# Throwaway: prints the computed board without writing any files or calling
# the AI copy step. Delete this workflow once the roster-value anchor change
# is verified.

on:
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compute board
        env:
          FANTASYPROS_API_KEY: ${{ secrets.FANTASYPROS_API_KEY }}
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
          LEAGUE_ID: ${{ secrets.LEAGUE_ID }}
        run: |
          cd tools
          python3 -c "
          from lib import load_env
          load_env()
          import power as PW
          b = PW.compute(2026)
          print(f'week {b[\"week\"]} gp {b[\"gp\"]} w_results {b[\"w_results\"]}')
          print(PW.board_lines(b))
          print()
          for r in b['rows']:
              print(r['owner'], 'roster_score=', r['roster_score'],
                    'draft_roster=', r.get('draft_roster'))
          "
